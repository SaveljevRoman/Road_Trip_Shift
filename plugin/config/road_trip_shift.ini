[plugin]
enabled=1

[input]
double_tap_ms=300
; Optional controls.sii override; empty selects the active profile automatically.
controls_file=

[cruise]
anti_hunt=1
; Economy borrows Normal after an increased cruise target until that target is reached.
normal_acceleration=1

[logging]
enabled=1
max_total_mb=50
sample_ms=200
; Process memory and plugin hook allocation counters; milliseconds.
memory_sample_ms=10000
