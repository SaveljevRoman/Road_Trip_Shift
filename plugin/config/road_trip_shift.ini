[plugin]
enabled=1

[input]
double_tap_ms=300
analog_kickdown=1
; Optional controls.sii override; empty selects the active profile automatically.
controls_file=

[cruise]
anti_hunt=1
; Economy enters current Normal beyond 3 km/h deficit and holds it until target.
normal_acceleration=1

[hud]
; Native game HUD notification on selected transmission-mode changes.
enabled=1
duration_ms=2500
; auto uses Windows UI language; explicit en / ru are also supported.
language=auto

[logging]
enabled=1
max_total_mb=50
sample_ms=200
; Process memory and plugin hook allocation counters; milliseconds.
memory_sample_ms=10000
; High-resolution duration aggregates and event timestamps; output unit is ns.
timing=1
timing_sample_ms=10000
; Sample mode/chooser native paths to limit instrumentation overhead.
timing_hook_every=64
